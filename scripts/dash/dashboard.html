<!DOCTYPE html>
<html>
<head>
    <title>MILO Dashboard</title>
    <style>
        body { background: #0a0a0a; color: #d1d1d1; font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; padding: 20px; line-height: 1.6; }
        .nav { margin-bottom: 20px; }
        .nav a { color: #00ff00; text-decoration: none; border: 1px solid #00ff00; padding: 8px 20px; border-radius: 4px; display: inline-block; }
        .header { border-bottom: 2px solid #00ff00; margin-bottom: 40px; padding-bottom: 10px; }
        h1 { color: #00ff00; margin: 0; font-size: 2.5em; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .node { border: 1px solid #333; padding: 25px; border-radius: 12px; background: #121212; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .node:hover { transform: translateY(-5px); border-color: #00ff00; }
        .node.Offline { border-color: #ff3333; opacity: 0.6; }
        .fleet-summary { margin-top: 50px; padding: 30px; border: 2px solid #00ccff; border-radius: 12px; background: rgba(0, 204, 255, 0.05); }
        h2 { margin-top: 0; color: #fff; font-size: 1.5em; }
        .stat-bar-container { background: #222; border-radius: 4px; height: 12px; margin: 5px 0 15px 0; overflow: hidden; }
        .stat-bar { height: 100%; background: #00ff00; transition: width 0.5s; }
        .status { font-size: 0.6em; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        .footer { color: #444; font-size: 0.8em; border-top: 1px solid #222; padding-top: 20px; }
    </style>
</head>
<body>
    <nav class="nav"><a href="/index.html">Home</a></nav>
    <div class="header"><h1>MILO Dashboard</h1></div>
    <div class="grid">
        <div class="node">
            <h2>MILO Online (45%)</h2>
            <div class="stat-bar-container"><div class="stat-bar" style="width: 45%"></div></div>
            <div class="stat-label"><span>CPU</span><span style="color: #fff; font-weight: bold; font-size: 0.7em">45%</span></div>
        </div>
        <div class="node">
            <h2>OTTO Online (55%)</h2>
            <div class="stat-bar-container"><div class="stat-bar" style="width: 55%"></div></div>
            <div class="stat-label"><span>CPU</span><span style="color: #fff; font-weight: bold; font-size: 0.7em">55%</span></div>
        </div>
        <div class="node">
            <h2>IGOR Online (31%)</h2>
            <div class="stat-bar-container"><div class="stat-bar" style="width: 31%"></div></div>
            <div class="stat-label"><span>CPU</span><span style="color: #fff; font-weight: bold; font-size: 0.7em">31%</span></div>
        </div>
        <div class="fleet-summary">
            <h2>FLEET AGGREGATE LOAD</h2>
            <div style="margin-top: 20px;">
                <div><span>Avg Fleet CPU:</span><span style="color: #00ccff; font-weight: bold;">45%</span></div>
                <div><span>Avg Fleet Mem:</span><span style="color: #00ccff; font-weight: bold;">55%</span></div>
                <div><span>Avg Fleet GPU:</span><span style="color: #00ccff; font-weight: bold;">65%</span></div>
            </div>
        </div>
    </div>
    <div class="footer">SYSTEM: 2026-04-28 09:18 UTC | AUTO-REFRESH: 60s</div>
</body>
</html>
